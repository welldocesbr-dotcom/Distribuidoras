let ceoTab = "vg";
const CEO_TABS = [["vg", "Visão geral"], ["fat", "Faturamento"], ["emp", "Empresas"], ["cad", "Cadastrar"], ["pl", "Planos e preços"]];
const ceoNav = () => `<div class="ceo-nav">${CEO_TABS.map(([k, t]) => `<button type="button" data-ceo="${k}" class="${ceoTab === k ? "on" : ""}">${t}</button>`).join("")}</div>`;
function assinList(es) {
  const L = es.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String((a.assin || {}).venc || "9999").localeCompare(String((b.assin || {}).venc || "9999")));
  const cor = s => s === "ativa" ? "var(--ok)" : "var(--bad)";
  return `<div class="card"><h2>Planos e valores por empresa</h2><small>Dados anotados em cada empresa (Empresas &gt; Gerenciar empresa). Ordenado pelo próximo vencimento.</small>${L.map(e => { const a = e.assin || {}; return `<div class="row"><span><b>${esc(e.nome)}</b> <small style="color:${cor(e.status)}">● ${esc(e.status)}</small><br><small>${a.plano ? esc(a.plano) : "sem plano anotado"}${a.valor ? " · " + R(a.valor) + (a.per ? " / " + esc(a.per) : "") : ""}${a.venc ? " · vence " + a.venc.split("-").reverse().join("/") : ""}</small></span></div>`; }).join("") || "<small>Nenhuma empresa ainda.</small>"}</div>`;
}
function ceoLiga() {
  const mostra = k => { ceoTab = k; app.querySelectorAll(".ceo-sec").forEach(x => { x.hidden = x.dataset.sec !== k; }); app.querySelectorAll(".ceo-nav button").forEach(b => b.classList.toggle("on", b.dataset.ceo === k)); const n = app.querySelector(".ceo-nav"); if (n) n.scrollIntoView({ block: "nearest" }); };
  app.querySelectorAll(".ceo-nav button").forEach(b => { b.onclick = () => mostra(b.dataset.ceo); });
  app.querySelectorAll(".emp [data-sus]").forEach(b => { b.onclick = async () => {
    const box = b.closest(".emp"), id = box.dataset.id, ativa = box.dataset.st === "ativa";
    if (!confirm(ativa ? "Suspender esta empresa? Os usuários dela ficam sem acesso até você reativar." : "Reativar esta empresa?")) return;
    try { await updateDoc(doc(db, "empresas", id), { status: ativa ? "suspensa" : "ativa" }); painelDono(); } catch (e) { msg(erro(e)); } }; });
}

}
function ligaSite() {
  if (!$("#ssv")) return;

  const pinta = () => { Object.keys(PLANOS).forEach(k => { const m = document.querySelector(`[data-pm="${k}"]`), a = document.querySelector(`[data-pa="${k}"]`); if (m) m.value = PLANOS[k].mensal.toFixed(2).replace(".", ","); if (a) a.value = PLANOS[k].anual.toFixed(2).replace(".", ","); }); $("#spx").value = pct(); };
  getDoc(doc(db, "site", "pagina")).then(d => { if (d.exists()) { const x = d.data(); $("#sw").value = x.whats || ""; $("#sd").value = x.demo || ""; aplicaPrecos(x); pinta(); } })
    .catch(e => say("Não consegui carregar os dados atuais (" + (e.code || e.message) + ").", true));
  $("#ssv").onclick = async () => {
    const demo = $("#sd").value.trim(); if (demo && !/^https?:\/\//.test(demo)) return say("O link da demonstração deve começar com https://", true);
    const precos = {}; for (const k of Object.keys(PLANOS)) { const m = numBR(document.querySelector(`[data-pm="${k}"]`).value), a = numBR(document.querySelector(`[data-pa="${k}"]`).value);
      if (!(m > 0) || !(a > 0)) return say("Confira os valores de " + PLANOS[k].nome + ".", true); precos[k] = { mensal: Math.round(m * 100) / 100, anual: Math.round(a * 100) / 100 }; }
    const px = numBR($("#spx").value); if (!(px >= 0 && px <= 90)) return say("O desconto do Pix deve ficar entre 0 e 90.", true);
    try { say("Salvando…"); await setDoc(doc(db, "site", "pagina"), { whats: $("#sw").value.replace(/\D/g, ""), demo, precos, pixDesc: px, atualizadoEm: Date.now() }, { merge: true });
      aplicaPrecos({ precos, pixDesc: px }); try { localStorage.setItem(SITE_KEY, JSON.stringify({ whats: $("#sw").value.replace(/\D/g, ""), demo, planos: SITE.planos, precos, pixDesc: px })); } catch (e) {}
      snd("ok"); say("Publicado. O cadastro e a página pública já usam estes valores."); } catch (e) { say("Erro ao salvar: " + (e.code || e.message), true); }
  };
}

let escolha = { plano: "completo", ciclo: "mensal", pix: true };
function planoBloco() {
  const e = escolha, an = e.ciclo === "anual";
  const tot = precoPlano(e.plano, e.ciclo, e.pix);
  return `<b class="g-pkt">Escolha seu plano</b>
  <div class="g-cy"><button type="button" data-cy="mensal" class="${an ? "" : "on"}">Mensal</button><button type="button" data-cy="anual" class="${an ? "on" : ""}">Anual · ${pct()}% no Pix</button></div>
  ${Object.entries(PLANOS).map(([k, p]) => { const v = an ? p.anual : p.mensal; return `<label class="g-op ${e.plano === k ? "on" : ""}"><input type="radio" name="pl" value="${k}" ${e.plano === k ? "checked" : ""}><span><b>${esc(p.nome)}</b><small>${esc(p.resumo)}</small></span><em>${BRL(v)}<small>/${an ? "ano" : "mês"}</small></em></label>`; }).join("")}
  ${an ? `<div class="g-px"><label class="g-pxl"><input type="checkbox" id="gpx" ${e.pix ? "checked" : ""}> Pagar no Pix (−${pct()}% de desconto)</label></div>` : ""}
  <div class="g-tot">Total: <b>${BRL(tot)}</b> ${an ? (e.pix ? `<small>à vista no Pix (de ${BRL(PLANOS[e.plano].anual)})</small>` : `<small>por ano</small>`) : `<small>por mês</small>`}</div>`;
}
function ligaPlano() {
  const box = $("#gpk"); if (!box) return;
  const redesenha = () => { box.innerHTML = planoBloco(); ligaPlano(); };
  box.querySelectorAll("[data-cy]").forEach(b => b.onclick = () => { escolha.ciclo = b.dataset.cy; redesenha(); });
  box.querySelectorAll("input[name=pl]").forEach(r => r.onchange = () => { escolha.plano = r.value; redesenha(); });
  const px = $("#gpx"); if (px) px.onchange = () => { escolha.pix = px.checked; redesenha(); };
}
