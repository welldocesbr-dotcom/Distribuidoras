let cPer = "30", cDe = "", cAte = "";
const pad2 = n => String(n).padStart(2, "0");
function indicadoresCEO(es, us, P = []) {
  const L = es.docs.map(d => d.data()), n = new Date(), DIA = 864e5, agora = Date.now(), d0 = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime(), m0 = new Date(n.getFullYear(), n.getMonth(), 1).getTime();

const PER = { mensal: 1, trimestral: 3, semestral: 6, anual: 12 };
