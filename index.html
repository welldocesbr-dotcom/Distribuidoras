<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14402e"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Distribuidora SaaS</title>
<style>
:root{--bg:#f4f5f1;--card:#fff;--ink:#17231d;--mut:#66726b;--line:#dfe3dc;--pri:#14402e;--acc:#e0a21b;--bad:#b3341f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#18231d;--ink:#eaf0ec;--mut:#9aa8a0;--line:#2a392f;--pri:#2f8a63;--bad:#e5705b}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#18231d;--ink:#eaf0ec;--mut:#9aa8a0;--line:#2a392f;--pri:#2f8a63;--bad:#e5705b}
@media print{header,nav,button,#pw{display:none!important}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Trebuchet MS",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--pri);color:#fff}
main{max-width:900px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input,select,button{font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
button{background:var(--pri);color:#fff;border:0;cursor:pointer;width:auto}button.alt{background:none;color:var(--ink);border:1px solid var(--line)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
small{color:var(--mut)}.err{color:var(--bad)}nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
nav button.on{background:var(--acc);color:#000}label{display:inline-block;margin:2px 8px 2px 0}label input{width:auto}
</style></head>
<body><header><b id="tt">Distribuidora SaaS</b><span><button id="inst" class="alt" style="display:none;color:#fff">Instalar app</button> <span id="hd"></span></span></header><main id="app"></main>
<div id="load" style="position:fixed;inset:0;background:#14402e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px">Carregando…</div>
<script type="module">
// Configuração do Firebase (chaves públicas; a segurança vem das regras do Firestore)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg = {
  apiKey: "AIzaSyAl06oo3G75stUlWlWjsGmUNMwAYJahpgo",
  authDomain: "distribuidora-saas-10781.firebaseapp.com",
  projectId: "distribuidora-saas-10781",
  storageBucket: "distribuidora-saas-10781.firebasestorage.app",
  messagingSenderId: "300874185378",
  appId: "1:300874185378:web:9684c0aaf93549a613b5fb"
};
const DONO = "cvHqi2SfkwhCcPIExCwRGKIFcJx2"; // UID do dono do SaaS
const fbApp = initializeApp(cfg);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

// App principal: login, painel do dono (empresas), usuários e permissões
import { onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail,
  createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc, setDoc, updateDoc, collection, getDocs, query, where, writeBatch, increment, deleteDoc, orderBy, limit }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const TELAS = { painel:"Painel", pdv:"PDV", produtos:"Produtos", estoque:"Estoque", clientes:"Clientes",
  fornecedores:"Fornecedores", financeiro:"Financeiro", relatorios:"Relatórios", usuarios:"Usuários", config:"Configurações" };
const TODAS = Object.keys(TELAS);
const PAPEIS = { admin:TODAS, gerente:TODAS.filter(t=>t!=="usuarios"), caixa:["pdv","clientes"],
  estoquista:["produtos","estoque","fornecedores"], vendedor:["painel","pdv","clientes"] };
const ACOES = { desconto: "Dar desconto/acréscimo", cancelar: "Cancelar vendas", sangria: "Sangria e suprimento", fechar: "Fechar caixa", excluir: "Excluir cadastros", custos: "Ver custos e lucro", editarproduto: "Cadastrar/editar produtos" };
const TODAS_A = Object.keys(ACOES), ACOES_PAD = { admin: TODAS_A, gerente: TODAS_A, caixa: ["fechar"], estoquista: ["custos", "editarproduto"], vendedor: [] };
const $ = s => document.querySelector(s), app = $("#app");
const pode = a => !!eu && (eu.papel === "admin" || (eu.acoes || ACOES_PAD[eu.papel] || []).includes(a));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let eu = null, empresa = null, tab = "usuarios";
const msg = (t) => alert(t);
const mostraErro = e => { const t = (e && (e.code || e.message)) || String(e); let b = $("#errbar");
  if (!b) { b = document.createElement("div"); b.id = "errbar"; b.style.cssText = "position:fixed;left:8px;right:8px;bottom:70px;background:#b3341f;color:#fff;padding:10px;border-radius:8px;z-index:9;font-size:13px"; document.body.appendChild(b); }
  b.innerHTML = "Erro: " + esc(t) + ' <button id="eok" style="background:#fff;color:#000;margin-left:8px">OK</button>'; $("#eok").onclick = () => b.remove(); };
addEventListener("error", e => mostraErro(e.error || e.message)); addEventListener("unhandledrejection", e => mostraErro(e.reason));

// Cria conta no Auth sem derrubar a sessão de quem está logado (app secundário)
async function criarConta(email, senha) {
  const a2 = getAuth(initializeApp(cfg, "sec" + Date.now()));
  const c = await createUserWithEmailAndPassword(a2, email, senha);
  await signOut(a2); return c.user.uid;
}
const erro = e => ({ "auth/invalid-credential":"E-mail ou senha incorretos.", "auth/email-already-in-use":"Este e-mail já está em uso.",
  "auth/weak-password":"A senha precisa ter ao menos 6 caracteres.", "permission-denied":"Sem permissão para esta ação." }[e.code] || e.message);

onAuthStateChanged(auth, async u => {
  if (criando) return;
  eu = empresa = null; $("#hd").innerHTML = "";
  if (!u) return inicio();
  $("#hd").innerHTML = `<button class="alt" style="color:#fff" id="so">Sair</button>`; $("#so").onclick = () => signOut(auth);
  if (u.uid === DONO) return painelDono();
  try {
    const p = await getDoc(doc(db, "usuarios", u.uid));
    if (!p.exists() || !p.data().ativo) return bloqueio("Seu acesso está desativado. Fale com o administrador.");
    eu = { uid: u.uid, ...p.data() };
    const e = await getDoc(doc(db, "empresas", eu.empresaId)); empresa = { id: e.id, ...e.data() };
    const venc = empresa.vencimento && new Date(empresa.vencimento + "T23:59:59") < new Date();
    if (empresa.status !== "ativa" || venc) return bloqueio("Acesso suspenso. Entre em contato com o suporte.");
    await carregaCfg(); $("#tt").textContent = empresa.nome; tab = eu.telas.includes(tab) ? tab : eu.telas[0]; appEmpresa();
  } catch (e) { bloqueio(erro(e)); }
});

function bloqueio(t) { app.innerHTML = `<div class="card err">${esc(t)}</div>`; }

function login() {
  $("#tt").textContent = "Distribuidora SaaS";
  app.innerHTML = `<div class="card" style="max-width:380px;margin:30px auto"><h2>Entrar</h2><div class="form" style="grid-template-columns:1fr">
  <input id="em" type="email" placeholder="E-mail" autocomplete="username"><input id="se" type="password" placeholder="Senha" autocomplete="current-password">
  <button id="ok">Entrar</button><button class="alt" id="rc">Esqueci minha senha</button><button class="alt" id="vl">Voltar</button></div><p class="err" id="er"></p></div>`;
  $("#ok").onclick = async () => { try { await signInWithEmailAndPassword(auth, $("#em").value.trim(), $("#se").value); } catch (e) { $("#er").textContent = erro(e); } };
  $("#vl").onclick = inicio;
  $("#rc").onclick = async () => { const m = $("#em").value.trim(); if (!m) return msg("Digite seu e-mail."); try { await sendPasswordResetEmail(auth, m); msg("Enviamos um link de redefinição para o seu e-mail."); } catch (e) { msg(erro(e)); } };
}

// ---------- Painel do dono do SaaS ----------
async function painelDono() {
  $("#tt").textContent = "Painel do SaaS";
  const [es, us] = await Promise.all([getDocs(collection(db, "empresas")), getDocs(collection(db, "usuarios"))]);
  const nu = {}; us.forEach(d => nu[d.data().empresaId] = (nu[d.data().empresaId] || 0) + 1);
  app.innerHTML = `<div class="card"><h2>Nova empresa</h2><div class="form">
  <input id="n" placeholder="Nome da empresa"><input id="an" placeholder="Nome do administrador"><input id="ae" type="email" placeholder="E-mail do administrador">
  <input id="as" type="password" placeholder="Senha inicial"><button id="cr">Criar empresa</button></div></div>
  <div class="card"><h2>Empresas (${es.size})</h2>${es.docs.map(d => { const e = d.data(); return `<div class="row"><span>${esc(e.nome)}<br><small>${nu[d.id] || 0} usuários · ${esc(e.status)}</small></span>
  <span><button data-open="${d.id}">Abrir</button> <button class="alt" data-id="${d.id}" data-s="${e.status}">${e.status === "ativa" ? "Suspender" : "Reativar"}</button></span></div>`; }).join("") || "<small>Nenhuma empresa ainda.</small>"}</div>`;
  $("#cr").onclick = async () => {
    const n = $("#n").value.trim(), ae = $("#ae").value.trim(), as = $("#as").value;
    if (!n || !ae || !as) return msg("Preencha empresa, e-mail e senha do administrador.");
    try {
      const uid = await criarConta(ae, as), ref = doc(collection(db, "empresas"));
      await setDoc(ref, { nome: n, status: "ativa", criadaEm: Date.now() });
      await setDoc(doc(db, "usuarios", uid), { empresaId: ref.id, nome: $("#an").value || "Administrador", email: ae, papel: "admin", telas: PAPEIS.admin, acoes: TODAS_A, ativo: true });
      painelDono();
    } catch (e) { msg(erro(e)); }
  };
  app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => abrirEmpresa(b.dataset.open));
  app.querySelectorAll("button[data-id]").forEach(b => b.onclick = async () => { await updateDoc(doc(db, "empresas", b.dataset.id), { status: b.dataset.s === "ativa" ? "suspensa" : "ativa" }); painelDono(); });
}

// ---------- App da empresa ----------
function appEmpresa() {
  app.innerHTML = `<nav>${eu.telas.map(t => `<button class="${t === tab ? "on" : ""}" data-t="${t}">${TELAS[t]}</button>`).join("")}</nav><div id="tela"></div>
  <div class="card"><small>${esc(eu.nome)} · ${esc(eu.papel)} · v13</small> <button class="alt" id="pw">Alterar senha</button> ${eu.uid === DONO ? '<button class="alt" id="vp0">Voltar ao painel</button>' : ""}</div>`;
  app.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.t; appEmpresa(); });
  if ($("#vp0")) $("#vp0").onclick = painelDono;
  $("#pw").onclick = async () => { await sendPasswordResetEmail(auth, eu.email); msg("Enviamos um link para alterar sua senha."); };
  if (!eu.telas.includes(tab)) return; // proteção de rota
  const M = { usuarios: telaUsuarios, produtos: telaProdutos, estoque: telaEstoque, pdv: telaPdv, painel: telaPainel, clientes: () => crud("clientes", "Cliente", CLI, subCli), fornecedores: () => crud("fornecedores", "Fornecedor", FOR, x => `${x.fantasia || ""} · ${x.cnpj || ""} · ${x.tel || ""}`), financeiro: telaFin, relatorios: telaRel, config: telaCfg }; M[tab] ? Promise.resolve(M[tab]()).catch(mostraErro) : $("#tela").innerHTML = `<div class="card"><h2>${TELAS[tab]}</h2><small>Este módulo chega nas próximas etapas.</small></div>`;
}

async function telaUsuarios() {
  const s = await getDocs(query(collection(db, "usuarios"), where("empresaId", "==", eu.empresaId)));
  const box = (n, o, sel) => Object.keys(o).map(k => `<label><input type="checkbox" data-${n}="${k}" ${sel.includes(k) ? "checked" : ""}>${o[k]}</label>`).join("");
  $("#tela").innerHTML = `<div class="card"><h2>Novo usuário</h2><div class="form"><input id="un" placeholder="Nome"><input id="ue" type="email" placeholder="E-mail">
  <input id="us" type="password" placeholder="Senha inicial"><select id="up">${Object.keys(PAPEIS).map(p => `<option>${p}</option>`).join("")}</select><button id="uc">Cadastrar</button></div></div>
  <div class="card"><h2>Usuários e permissões</h2><small>Marque o que cada usuário pode ver (telas) e fazer (ações). Vale no próximo login dele.</small>${s.docs.map(d => { const u = d.data(), a = u.acoes || ACOES_PAD[u.papel] || [];
  return `<details class="row" style="display:block"><summary>${esc(u.nome)} · ${esc(u.papel)} ${u.ativo ? "" : "<span class='err'>(inativo)</span>"}<br><small>${esc(u.email)}</small></summary>
  <div data-u="${d.id}"><p><b>Telas que pode ver</b><br>${box("t", TELAS, u.telas)}</p><p><b>O que pode fazer</b><br>${box("a", ACOES, a)}</p>
  <button class="sv">Salvar permissões</button> ${d.id === eu.uid ? "" : `<button class="alt tg">${u.ativo ? "Desativar acesso" : "Reativar acesso"}</button>`}</div></details>`; }).join("")}</div>`;
  $("#uc").onclick = async () => {
    const e = $("#ue").value.trim(), p = $("#up").value;
    if (!e || !$("#us").value) return msg("Informe e-mail e senha inicial.");
    try { const uid = await criarConta(e, $("#us").value);
      await setDoc(doc(db, "usuarios", uid), { empresaId: eu.empresaId, nome: $("#un").value || e, email: e, papel: p, telas: PAPEIS[p], acoes: ACOES_PAD[p], ativo: true }); telaUsuarios();
    } catch (x) { msg(erro(x)); }
  };
  $("#tela").querySelectorAll("[data-u]").forEach(bx => {
    const id = bx.dataset.u, ck = n => [...bx.querySelectorAll(`[data-${n}]:checked`)].map(i => i.dataset[n]);
    bx.querySelector(".sv").onclick = async () => { const t = ck("t"); if (id === eu.uid && !t.includes("usuarios")) t.push("usuarios");
      try { await updateDoc(doc(db, "usuarios", id), { telas: t, acoes: ck("a") }); msg("Permissões salvas."); } catch (e) { msg(erro(e)); } };
    const tg = bx.querySelector(".tg"); if (tg) tg.onclick = async () => { await updateDoc(doc(db, "usuarios", id), { ativo: tg.textContent.startsWith("Reativar") }); telaUsuarios(); };
  });
}

// ---------- Módulos da empresa: Produtos, Estoque e PDV ----------
const col = n => collection(db, "empresas", eu.empresaId, n);
const dref = (n, id) => doc(db, "empresas", eu.empresaId, n, id);
const num = v => +String(v).replace(",", ".") || 0;
const R = v => num(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
let prods = [], cart = [], pags = [], desc = 0, busca = "", edId = null;
const mov = (b, p, tipo, qtd, obs) => b.set(doc(col("movs")), { data: Date.now(), prodId: p.id, nome: p.nome, tipo, qtd, obs, user: eu.nome });
async function carregarProds() { const s = await getDocs(col("produtos")); prods = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.nome.localeCompare(b.nome)); }
async function abrirEmpresa(id) {
  const e = await getDoc(doc(db, "empresas", id)); empresa = { id, ...e.data() };
  eu = { uid: DONO, nome: "Dono do SaaS", email: auth.currentUser.email, papel: "admin", empresaId: id, telas: TODAS, ativo: true };
  $("#tt").textContent = empresa.nome; tab = "pdv"; appEmpresa();
}

async function telaProdutos() {
  await carregarProds(); imgNova = "";
  $("#tela").innerHTML = `<div class="card"><h2>${edId ? "Editar" : "Novo"} produto</h2><div class="form"><input id="pn" placeholder="Nome"><input id="pc" placeholder="Categoria">
  <input id="pb" placeholder="Código de barras"><input id="pcu" type="number" step="0.01" placeholder="Custo"><input id="pv" type="number" step="0.01" placeholder="Venda">
  <input id="pe" type="number" placeholder="Estoque inicial" ${edId ? "disabled" : ""}><input id="pm" type="number" placeholder="Estoque mínimo"><input id="pi" type="file" accept="image/*"><button id="ps">Salvar</button></div></div>
  <div class="card"><h2>Produtos (${prods.length})</h2>${prods.map(p => `<div class="row"><span>${thumb(p)}${esc(p.nome)}<br><small>${esc(p.cat)} · ${pode("custos") ? "custo " + R(p.custo) + " · " : ""}venda ${R(p.venda)}${pode("custos") ? " · margem " + (p.custo ? Math.round((p.venda / p.custo - 1) * 100) : 0) + "%" : ""}</small></span>
  <span><b class="${p.est <= p.min ? "err" : ""}">${p.est}</b> <button class="alt" data-e="${p.id}">Editar</button> <button class="alt" data-d="${p.id}">Excluir</button></span></div>`).join("") || "<small>Nenhum produto.</small>"}</div>`;
  const p0 = prods.find(x => x.id === edId);
  if (p0) { $("#pn").value = p0.nome; $("#pc").value = p0.cat; $("#pb").value = p0.cod || ""; $("#pcu").value = p0.custo; $("#pv").value = p0.venda; $("#pm").value = p0.min; }
  $("#pi").onchange = async e => { try { imgNova = await reduzir(e.target.files[0]); } catch (x) { msg("Não foi possível ler a imagem."); } };
  $("#ps").onclick = async () => {
    const nome = $("#pn").value.trim(), venda = num($("#pv").value); if (!nome || !venda) return msg("Informe nome e valor de venda.");
    const d = { nome, cat: $("#pc").value || "Geral", cod: $("#pb").value.trim(), custo: num($("#pcu").value), venda, min: num($("#pm").value) }; if (imgNova) d.img = imgNova;
    try {
      if (edId) await updateDoc(dref("produtos", edId), d);
      else { const ref = doc(col("produtos")), est = num($("#pe").value), b = writeBatch(db); b.set(ref, { ...d, est, criadoEm: Date.now() }); if (est) mov(b, { id: ref.id, nome }, "entrada", est, "Estoque inicial"); await b.commit(); }
      edId = null; telaProdutos();
    } catch (e) { msg(erro(e)); }
  };
  $("#tela").querySelectorAll("[data-e]").forEach(b => b.onclick = () => { edId = b.dataset.e; telaProdutos(); });
  $("#tela").querySelectorAll("[data-d]").forEach(b => b.onclick = async () => { if (confirm("Excluir este produto?")) { await deleteDoc(dref("produtos", b.dataset.d)); telaProdutos(); } });
  if (!pode("editarproduto")) { $("#ps").closest(".card").remove(); $("#tela").querySelectorAll("[data-e]").forEach(b => b.remove()); }
  if (!pode("excluir")) $("#tela").querySelectorAll("[data-d]").forEach(b => b.remove());
}

async function telaEstoque() {
  await carregarProds();
  const h = await getDocs(query(col("movs"), orderBy("data", "desc"), limit(30))), baixo = prods.filter(p => p.est <= p.min);
  $("#tela").innerHTML = `<div class="card"><h2>Alertas de estoque</h2>${baixo.map(p => `<div class="row"><span>${esc(p.nome)}</span><b class="err">${p.est == 0 ? "ZERADO" : p.est + " (mín. " + p.min + ")"}</b></div>`).join("") || "<small>Nenhum alerta.</small>"}</div>
  <div class="card"><h2>Movimentação</h2><div class="form"><select id="ep">${prods.map(p => `<option value="${p.id}">${esc(p.nome)} (${p.est})</option>`).join("")}</select>
  <select id="et"><option value="entrada">Entrada</option><option value="saida">Saída</option><option value="ajuste">Ajuste/Inventário (quantidade real)</option><option value="perda">Perda</option><option value="quebra">Quebra</option><option value="vencido">Produto vencido</option></select>
  <input id="eq" type="number" placeholder="Quantidade"><input id="eo" placeholder="Observação"><button id="eb">Registrar</button></div></div>
  <div class="card"><h2>Histórico</h2>${h.docs.map(d => { const m = d.data(); return `<div class="row"><span>${esc(m.nome)}<br><small>${new Date(m.data).toLocaleString("pt-BR")} · ${esc(m.user)} ${esc(m.obs || "")}</small></span><b>${esc(m.tipo)} ${m.qtd}</b></div>`; }).join("") || "<small>Sem movimentações.</small>"}</div>`;
  $("#eb").onclick = async () => {
    const p = prods.find(x => x.id === $("#ep").value), t = $("#et").value, q = num($("#eq").value);
    if (!p || q < 0 || (!q && t !== "ajuste")) return msg("Informe a quantidade.");
    const delta = t === "entrada" ? q : t === "ajuste" ? q - p.est : -q;
    if (p.est + delta < 0) return msg("Estoque não pode ficar negativo.");
    try { const b = writeBatch(db); b.update(dref("produtos", p.id), { est: t === "ajuste" ? q : increment(delta) }); mov(b, p, t, q, $("#eo").value); await b.commit(); telaEstoque(); } catch (e) { msg(erro(e)); }
  };
}

let caixa = null, cat = "", dsTipo = "R$", ac = 0;
async function acharCaixa() { const s = await getDocs(query(col("caixas"), where("status", "==", "aberto"))); const d = s.docs.find(x => x.data().uid === eu.uid); caixa = d ? { id: d.id, ...d.data() } : null; }
async function telaPdv() {
  await Promise.all([carregarProds(), getDocs(col("clientes")).then(s => { cls = s.docs.map(d => ({ id: d.id, ...d.data() })); }), acharCaixa()]);

    const fs = await getDocs(query(col("caixas"), where("status", "==", "fechado"))), FL = fs.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.fechadoEm - a.fechadoEm).slice(0, 5);

  const dias = [...Array(7)].map((_, i) => { const d = dia(Date.now() - (6 - i) * 864e5); return [d.slice(8) + "/" + d.slice(5, 7), s(x => x === d)]; }), mx = Math.max(...dias.map(d => d[1]), 1);
  const rk = {}, rv = {}, at = new Set(); v.forEach(x => { x.itens.forEach(i => { rk[i.nome] = (rk[i.nome] || 0) + i.q; }); rv[x.vendedor] = (rv[x.vendedor] || 0) + x.total; if (x.clienteId && x.data > Date.now() - 30 * 864e5) at.add(x.clienteId); });

async function telaRel() {
  const hj = dia(Date.now()); rDe ||= hj.slice(0, 8) + "01"; rAte ||= hj;
  const [v, f] = await Promise.all([lerCol("vendas"), lerCol("fin")]), vp = v.filter(x => dia(x.data) >= rDe && dia(x.data) <= rAte), dp = f.filter(x => x.tipo === "saida" && x.data >= rDe && x.data <= rAte);
  const pg = {}, pr = {}, cl = {}, vd = {}; vp.forEach(x => { x.pags.forEach(p => { pg[p.f] = (pg[p.f] || 0) + p.v; }); x.itens.forEach(i => { pr[i.nome] = (pr[i.nome] || 0) + i.preco * i.q; }); cl[x.cliente || "Consumidor"] = (cl[x.cliente || "Consumidor"] || 0) + x.total; vd[x.vendedor] = (vd[x.vendedor] || 0) + x.total; });
  const bl = (t, o) => `<div class="card"><h2>${t}</h2>${Object.entries(o).sort((a, b) => b[1] - a[1]).map(([n, x]) => `<div class="row"><span>${esc(n)}</span><b>${R(x)}</b></div>`).join("") || "<small>Sem dados.</small>"}</div>`;
  const lucro = soma(vp, lucroV);

  <div class="card"><h2>Resumo · ${esc(empresa.nome)}</h2><div class="row"><span>Vendas</span><b>${vp.length}</b></div><div class="row"><span>Faturamento</span><b>${R(soma(vp, x => x.total))}</b></div>${pode("custos") ? `<div class="row"><span>Lucro bruto</span><b>${R(lucro)}</b></div>` : ""}<div class="row"><span>Despesas</span><b>${R(soma(dp, x => x.valor))}</b></div>${pode("custos") ? `<div class="row"><span>Lucro líquido</span><b>${R(lucro - soma(dp, x => x.valor))}</b></div>` : ""}</div>
  ${bl("Formas de pagamento", pg)}${bl("Ranking de produtos", pr)}${bl("Ranking de clientes", cl)}${bl("Ranking de vendedores", vd)}`;
