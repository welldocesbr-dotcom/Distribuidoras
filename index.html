<style>

 main{max-width:none;padding:0}

 #app:has(>nav)>nav{flex-direction:column;background:var(--side);height:calc(100vh - 58px);position:sticky;top:0;padding:14px 10px;overflow:auto;grid-row:1/3;gap:4px;margin:0}
 #app:has(>nav)>nav button{background:transparent;color:#d8d8de;border:0;text-align:left;padding:13px 14px;border-radius:10px;font-size:15px}

 #app:has(>nav)>nav select{width:100%;margin-bottom:6px}
 #tela{padding:16px 16px 4px}#app:has(>nav)>.card:last-child{grid-column:2;margin:0 16px 16px}
 .pdvg{grid-template-columns:1fr 410px}.side{position:sticky;top:12px;align-self:start}
}

input.busca{font-size:17px;padding:14px 16px;border-radius:12px;border:2px solid var(--pri)}
.tile .pr{color:var(--pri);font-size:14px}.tile img,.tile .ph{width:76px;height:76px}

<body><header><span style="display:flex;align-items:center;gap:10px;min-width:0"><img src="icon-192.png" width="32" height="32" alt="" style="border-radius:8px"><b id="tt">GWH Gestão</b></span><span><button id="tema" class="alt" style="color:#fff" title="Tema claro/escuro">☀️</button> <button id="snd" class="alt" style="color:#fff" title="Sons">🔊</button> <button id="inst" class="alt" style="display:none;color:#fff">Instalar app</button> <span id="hd"></span></span></header><main id="app"></main>
<div id="load" style="position:fixed;inset:0;background:#09090b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px"><img src="icon-192.png" width="96" height="96" alt="GWH Gestão" style="border-radius:22px;box-shadow:0 0 44px rgba(255,150,0,.55)"></div>
<script type="module">
// Configuração do Firebase (chaves públicas; a segurança vem das regras do Firestore)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, browserSessionPersistence, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg = {
  apiKey: "AIzaSyAl06oo3G75stUlWlWjsGmUNMwAYJahpgo",
  authDomain: "distribuidora-saas-10781.firebaseapp.com",
  projectId: "distribuidora-saas-10781",
  storageBucket: "distribuidora-saas-10781.firebasestorage.app",
  messagingSenderId: "300874185378",
  appId: "1:300874185378:web:9684c0aaf93549a613b5fb"
};
const DONO = "cvHqi2SfkwhCcPIExCwRGKIFcJx2"; // UID do dono do SaaS
const fbApp = initializeApp(cfg);
const auth = initializeAuth(fbApp, { persistence: [indexedDBLocalPersistence, browserLocalPersistence, browserSessionPersistence] }); // se o IndexedDB falhar (comum no iPhone), usa localStorage
const db = getFirestore(fbApp);

// App principal: login, painel do dono (empresas), usuários e permissões
import { onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail,
  createUserWithEmailAndPassword, reauthenticateWithCredential, EmailAuthProvider, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc, setDoc, updateDoc, collection, getDocs, query, where, onSnapshot, writeBatch, increment, deleteDoc, orderBy, limit }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const TELAS = { painel:"Painel", pdv:"PDV", produtos:"Produtos", estoque:"Estoque", clientes:"Clientes",
  fornecedores:"Fornecedores", financeiro:"Financeiro", relatorios:"Relatórios", usuarios:"Usuários", config:"Configurações" };
const TODAS = Object.keys(TELAS);
const paraEmail = u => { u = String(u).trim().toLowerCase(); return u.includes("@") ? u : u + "@gwhgestao.app"; };
const validaUser = u => /^[a-z0-9._-]{3,30}$/.test(u), MSGUSER = "Usuário: de 3 a 30 letras minúsculas, números, ponto, hífen ou _ (sem espaços).";
const ICO = { rede: "🏢", painel: "🏠", pdv: "🛒", produtos: "📦", estoque: "🏷️", clientes: "👥", fornecedores: "🚚", financeiro: "💰", relatorios: "📄", usuarios: "🔐", config: "⚙️" };
const PAPEIS = { admin:TODAS, gerente:TODAS.filter(t=>t!=="usuarios"), caixa:["pdv","clientes"],
  estoquista:["produtos","estoque","fornecedores"], vendedor:["painel","pdv","clientes"] };
const ACOES = { desconto: "Dar desconto/acréscimo", cancelar: "Cancelar vendas", sangria: "Sangria e suprimento", fechar: "Fechar caixa", excluir: "Excluir cadastros", custos: "Ver custos e lucro", editarproduto: "Cadastrar/editar produtos" };
const TODAS_A = Object.keys(ACOES), ACOES_PAD = { admin: TODAS_A, gerente: TODAS_A, caixa: ["fechar"], estoquista: ["custos", "editarproduto"], vendedor: [] };
const $ = s => document.querySelector(s), app = $("#app");
const pode = a => !!eu && (eu.papel === "admin" || (eu.acoes || ACOES_PAD[eu.papel] || []).includes(a));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let eu = null, empresa = null, tab = "usuarios";
let sonsOn = true; try { sonsOn = localStorage.getItem("som") !== "off"; } catch (e) {}
let AC, eTs = 0;
function tom(f, d = .08, tipo = "sine", v = .05, t0 = 0) { if (!sonsOn) return; try { AC ||= new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume();
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + t0; o.type = tipo; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d); } catch (e) {} }
const SONS = { clique: () => tom(900, .04, "square", .02), add: () => tom(1000, .07, "triangle", .06), ok: () => { tom(660, .1); tom(880, .12, "sine", .05, .1); tom(1175, .2, "sine", .05, .2); },
  abre: () => { tom(523, .1); tom(784, .16, "sine", .05, .1); }, cancel: () => { tom(500, .1, "square", .03); tom(350, .16, "square", .03, .1); }, aviso: () => { tom(700, .1); tom(520, .14, "sine", .05, .12); }, erro: () => { tom(220, .15, "sawtooth", .04); tom(165, .22, "sawtooth", .04, .15); } };
const snd = n => SONS[n] && SONS[n]();
addEventListener("click", e => { if (e.target.closest && e.target.closest("button,summary,label")) snd("clique"); }, true);
const msg = (t) => { if (Date.now() - eTs > 300) snd("aviso"); alert(t); };
const mostraErro = e => { const t = (e && (e.code || e.message)) || String(e); let b = $("#errbar");
  if (!b) { b = document.createElement("div"); b.id = "errbar"; b.style.cssText = "position:fixed;left:8px;right:8px;bottom:70px;background:#b3341f;color:#fff;padding:10px;border-radius:8px;z-index:9;font-size:13px"; document.body.appendChild(b); }
  b.innerHTML = "Erro: " + esc(t) + ' <button id="eok" style="background:#fff;color:#000;margin-left:8px">OK</button>'; $("#eok").onclick = () => b.remove(); };
addEventListener("error", e => mostraErro(e.error || e.message)); addEventListener("unhandledrejection", e => mostraErro(e.reason));

// Cria conta no Auth sem derrubar a sessão de quem está logado (app secundário)
async function criarConta(email, senha) {
  const a2 = initializeAuth(initializeApp(cfg, "sec" + Date.now()), { persistence: inMemoryPersistence });
  const c = await createUserWithEmailAndPassword(a2, email, senha);
  await signOut(a2); return c.user.uid;
}
const erro = e => (eTs = Date.now(), snd("erro"), { "auth/invalid-credential":"Usuário ou senha incorretos.", "auth/email-already-in-use":"Este usuário já existe. Escolha outro.", "auth/requires-recent-login":"Entre novamente e tente de novo.",
  "auth/weak-password":"A senha precisa ter ao menos 6 caracteres.", "permission-denied":"Sem permissão para esta ação." }[e.code] || e.message);

onAuthStateChanged(auth, async u => {
  if (criando) return;
  document.body.classList.toggle("pub", !u);
  unsubs.forEach(f => f()); unsubs = []; if (unsubDono) { unsubDono(); unsubDono = null; }
  eu = empresa = null; $("#hd").innerHTML = "";
  if (!u) return inicio();
  $("#hd").innerHTML = `<button class="alt" style="color:#fff" id="so">Sair</button>`; $("#so").onclick = () => signOut(auth);
  if (u.uid === DONO) return painelDono();
  try {
    const p = await getDoc(doc(db, "usuarios", u.uid));
    if (!p.exists() || !p.data().ativo) return bloqueio("Seu acesso está desativado. Fale com o administrador.");
    eu = { uid: u.uid, ...p.data() };
    const e = await getDoc(doc(db, "empresas", eu.empresaId)); empresa = { id: e.id, ...e.data() };
    eu.rede = [...new Set([eu.empresaId, ...(eu.empresas || [])])]; eu.nomes = {};
    if (eu.rede.length > 1) for (const id of eu.rede) { try { eu.nomes[id] = (await getDoc(doc(db, "empresas", id))).data().nome; } catch (x) {} }
    const venc = empresa.vencimento && new Date(empresa.vencimento + "T23:59:59") < new Date();
    if (empresa.status !== "ativa" || venc) return bloqueio(empresa.status === "bloqueada" ? "Acesso bloqueado. Entre em contato com o suporte." : "Acesso suspenso. Entre em contato com o suporte.");
    await carregaCfg(); $("#tt").textContent = empresa.nome; tab = eu.telas.includes(tab) ? tab : eu.telas[0]; appEmpresa(); tempoReal(); snd("abre");
  } catch (e) { bloqueio(erro(e)); }
});

function bloqueio(t) { app.innerHTML = `<div class="card err">${esc(t)}</div>`; }

function login() {
  $("#tt").textContent = "GWH Gestão";
  app.innerHTML = `<div class="card" style="max-width:380px;margin:30px auto"><img class="logo" src="icon-192.png" width="76" height="76" alt="" style="margin-bottom:10px"><h2 style="text-align:center">Entrar</h2><div class="form" style="grid-template-columns:1fr">
  <input id="em" type="text" placeholder="Usuário" autocomplete="username" autocapitalize="none" autocorrect="off"><input id="se" type="password" placeholder="Senha" autocomplete="current-password">
  <button id="ok">Entrar</button><button class="alt" id="rc">Esqueci minha senha</button><button class="alt" id="vl">Voltar</button></div><p class="err" id="er"></p></div>`;
  $("#ok").onclick = async () => { try { await signInWithEmailAndPassword(auth, paraEmail($("#em").value), $("#se").value); } catch (e) { $("#er").textContent = erro(e); } };
  $("#vl").onclick = inicio;
  $("#rc").onclick = async () => { const m = $("#em").value.trim(); if (!m.includes("@") || m.endsWith("@gwhgestao.app")) return msg("Para redefinir a senha, fale com o administrador da sua empresa ou com o suporte."); try { await sendPasswordResetEmail(auth, m); msg("Enviamos um link de redefinição para o seu e-mail."); } catch (e) { msg(erro(e)); } };
}

// ---------- Painel do dono do SaaS ----------
const COLS = ["produtos", "vendas", "clientes", "fornecedores", "fin", "movs", "cmov", "caixas", "config"];
async function painelDono() {
  unsubs.forEach(f => f()); unsubs = []; eu = empresa = null; $("#tt").textContent = "GWH Gestão · Painel do CEO";
  if (!unsubDono) { let p1 = true; unsubDono = onSnapshot(collection(db, "empresas"), () => { if (p1) { p1 = false; return; } pend = true; clearTimeout(tmR); tmR = setTimeout(() => { if (!eu && !ocupado()) { pend = false; painelDono(); } }, 400); }, e => console.warn(e.code)); }
  const [es, us] = await Promise.all([getDocs(collection(db, "empresas")), getDocs(collection(db, "usuarios"))]);
  const nu = {}, adm = {}, dados = {}; us.forEach(d => { const u = d.data(); nu[u.empresaId] = (nu[u.empresaId] || 0) + 1; if (u.papel === "admin" && !adm[u.empresaId]) adm[u.empresaId] = u.usuario || u.email; });
  es.docs.forEach(d => { dados[d.id] = d.data(); });
  app.innerHTML = `<div class="card"><h2>Nova empresa</h2><div class="form"><input id="n" placeholder="Nome da empresa"><input id="an" placeholder="Nome do administrador"><input id="ae" placeholder="Usuário do administrador" autocapitalize="none"><input id="as" type="password" placeholder="Senha inicial"><input id="vl" placeholder="ou vincular a um usuário existente"><button id="cr">Criar empresa</button></div></div>
  <div class="card"><h2>Acesso a várias empresas</h2><small>Dê a um usuário acesso a mais de uma empresa (ex.: dono de várias lojas).</small><div class="form" style="margin-top:8px"><input id="vu" placeholder="Usuário (ou e-mail) do responsável"><button id="vb">Buscar</button></div><div id="vres"></div></div>
  <div class="card"><h2>Empresas (${es.size})</h2>${es.docs.map(d => { const e = d.data(); return `<div class="emp" data-id="${d.id}" style="border-top:1px solid var(--line);padding:10px 0">
  <div class="row" style="border:0"><span><b>${esc(e.nome)}</b> <small style="color:${e.status === "ativa" ? "var(--ok)" : "var(--bad)"}">● ${esc(e.status)}</small><br><small>${esc(adm[d.id] || "sem administrador")} · ${nu[d.id] || 0} usuários${e.criadaEm ? " · criada em " + new Date(e.criadaEm).toLocaleDateString("pt-BR") : ""}</small></span><button data-open>Abrir</button></div>
  <details><summary>Gerenciar empresa</summary><div class="form" style="margin-top:8px"><input data-f="nome" placeholder="Nome da empresa" value="${esc(e.nome)}"><input data-f="cnpj" placeholder="CNPJ"><input data-f="tel" placeholder="Telefone"><input data-f="end" placeholder="Endereço">
  <select data-f="status"><option value="ativa">Ativa</option><option value="suspensa">Suspensa (pausa temporária)</option><option value="bloqueada">Bloqueada</option></select><button data-save>Salvar alterações</button><button class="alt" data-bk>Baixar backup</button><button class="alt" data-del style="color:var(--bad)">Excluir empresa</button></div></details></div>`; }).join("") || "<small>Nenhuma empresa ainda.</small>"}</div>`;
  $("#cr").onclick = async () => {
    const n = $("#n").value.trim(), au = $("#ae").value.trim().toLowerCase(), as = $("#as").value, vl = $("#vl").value.trim();
    if (!n || (!vl && (!au || !as))) return msg("Informe o nome da empresa e o usuário e senha do administrador (ou o usuário para vincular).");
    if (au && !validaUser(au) && !au.includes("@")) return msg(MSGUSER);
    try {
      let alvo = null; if (vl) { const s = await getDocs(query(collection(db, "usuarios"), where("email", "==", paraEmail(vl)))); if (s.empty) return msg("Usuário para vincular não encontrado."); alvo = s.docs[0]; }
      const uid = au ? await criarConta(paraEmail(au), as) : null, ref = doc(collection(db, "empresas"));
      await setDoc(ref, { nome: n, status: "ativa", criadaEm: Date.now() });
      if (uid) await setDoc(doc(db, "usuarios", uid), { empresaId: ref.id, nome: $("#an").value || "Administrador", usuario: au, email: paraEmail(au), papel: "admin", telas: PAPEIS.admin, acoes: TODAS_A, ativo: true });
      if (alvo) await updateDoc(doc(db, "usuarios", alvo.id), { empresas: [...new Set([...(alvo.data().empresas || []), ref.id])] });
      painelDono();
    } catch (e) { msg(erro(e)); }
  };
  $("#vb").onclick = async () => {
    const s = await getDocs(query(collection(db, "usuarios"), where("email", "==", paraEmail($("#vu").value)))); if (s.empty) return msg("Usuário não encontrado.");
    const d = s.docs[0], u = d.data(), sel = new Set([u.empresaId, ...(u.empresas || [])]);

async function excluirEmpresa(id, nome) {
  if (prompt(`ATENÇÃO: isto apaga TODOS os dados da empresa (vendas, clientes, estoque, usuários) e NÃO pode ser desfeito.\nBaixe o backup antes.\nPara confirmar, digite o nome da empresa:\n${nome}`) !== nome) return msg("Nome incorreto. Nada foi excluído.");
  const apaga = async refs => { for (let i = 0; i < refs.length; i += 400) { const b = writeBatch(db); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); } };
  try {
    for (const n of COLS) await apaga((await getDocs(collection(db, "empresas", id, n))).docs.map(d => d.ref));
    await apaga((await getDocs(query(collection(db, "usuarios"), where("empresaId", "==", id)))).docs.map(d => d.ref));

}

  const [v, f] = await Promise.all([lerCol("vendas"), lerCol("fin")]), vp = v.filter(x => dia(x.data) >= rDe && dia(x.data) <= rAte), dp = f.filter(x => x.tipo === "saida" && x.data >= rDe && x.data <= rAte);
  const pg = {}, pr = {}, cl = {}, vd = {}; vp.forEach(x => { x.pags.forEach(p => { pg[p.f] = (pg[p.f] || 0) + p.v; }); x.itens.forEach(i => { pr[i.nome] = (pr[i.nome] || 0) + i.preco * i.q; }); cl[x.cliente || "Consumidor"] = (cl[x.cliente || "Consumidor"] || 0) + x.total; vd[x.vendedor] = (vd[x.vendedor] || 0) + x.total; });
  const bl = (t, o) => `<div class="card"><h2>${t}</h2>${Object.entries(o).sort((a, b) => b[1] - a[1]).map(([n, x]) => `<div class="row"><span>${esc(n)}</span><b>${R(x)}</b></div>`).join("") || "<small>Sem dados.</small>"}</div>`;
  const lucro = soma(vp, lucroV);
  $("#tela").innerHTML = `<div class="card"><h2>Período</h2><div class="form"><input id="rd" type="date" value="${rDe}"><input id="ra" type="date" value="${rAte}"><button id="rf">Filtrar</button><button class="alt" id="rc">Exportar CSV (Excel)</button><button class="alt" id="rp">Imprimir / PDF</button></div></div>
  <div class="card"><h2>Resumo · ${esc(empresa.nome)}</h2><div class="row"><span>Vendas</span><b>${vp.length}</b></div><div class="row"><span>Faturamento</span><b>${R(soma(vp, x => x.total))}</b></div>${pode("custos") ? `<div class="row"><span>Lucro bruto</span><b>${R(lucro)}</b></div>` : ""}<div class="row"><span>Despesas</span><b>${R(soma(dp, x => x.valor))}</b></div>${pode("custos") ? `<div class="row"><span>Lucro líquido</span><b>${R(lucro - soma(dp, x => x.valor))}</b></div>` : ""}</div>
  ${bl("Formas de pagamento", pg)}${bl("Ranking de produtos", pr)}${bl("Ranking de clientes", cl)}${bl("Ranking de vendedores", vd)}`;
  $("#rf").onclick = () => { rDe = $("#rd").value; rAte = $("#ra").value; telaRel(); };
  $("#rp").onclick = () => print();
  $("#rc").onclick = () => baixar("vendas.csv", "\ufeffData;Cliente;Vendedor;Produto;Qtd;Preço;Total venda\n" + vp.flatMap(x => x.itens.map(i => [new Date(x.data).toLocaleString("pt-BR"), x.cliente || "", x.vendedor, i.nome, i.q, i.preco, x.total].join(";"))).join("\n"), "text/csv");
}
